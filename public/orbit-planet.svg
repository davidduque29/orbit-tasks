<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Orbit Tasks, planeta con anillo violeta">
<defs>
  <radialGradient id="sphere" cx=".32" cy=".17" r=".87">
    <stop offset="0" stop-color="#a487ff"/><stop offset=".32" stop-color="#7853df"/>
    <stop offset=".7" stop-color="#5130aa"/><stop offset="1" stop-color="#29125f"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
    <stop stop-color="#40218e"/><stop offset=".35" stop-color="#6e43cf"/>
    <stop offset=".7" stop-color="#c3afff"/><stop offset="1" stop-color="#794bdc"/>
  </linearGradient>
  <linearGradient id="ringLight" x1=".1" y1="1" x2=".9" y2="0">
    <stop stop-color="#8c65ed"/><stop offset=".5" stop-color="#dfd2ff"/>
    <stop offset="1" stop-color="#936be6"/>
  </linearGradient>
</defs>
<!-- Behind the planet, the distant part of the tilted orbit. -->
<path d="M163 62 C201 48 225 49 231 63 C239 83 218 109 199 127"
  fill="none" stroke="#6a43c9" stroke-width="17" stroke-linecap="round"/>
<path d="M169 64 C203 51 224 52 228 65"
  fill="none" stroke="#b19aff" stroke-width="5" stroke-linecap="round" opacity=".48"/>
<!-- The globe, kept smooth with a subtle three-dimensional gradient. -->
<circle cx="126" cy="128" r="80" fill="url(#sphere)"/>
<path d="M79 79 C62 105 62 146 81 174" fill="none"
  stroke="#e1d2ff" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
<path d="M174 90 C191 127 175 164 154 184" fill="none"
  stroke="#220a54" stroke-opacity=".14" stroke-width="12" stroke-linecap="round"/>
<!-- Foreground orbit is a continuous crescent crossing the lower globe. -->
<path d="M46 134 C19 165 20 186 45 192 C79 201 144 171 192 135 C219 114 233 90 232 73"
  fill="none" stroke="#311569" stroke-width="21" stroke-linecap="round"/>
<path d="M45 132 C26 160 26 180 47 185 C83 191 142 163 190 128 C217 108 229 88 230 73"
  fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round"/>
<path d="M52 160 C88 181 171 131 216 91" fill="none"
  stroke="url(#ringLight)" stroke-width="4.3" stroke-linecap="round" opacity=".88"/>
<!-- White four-point star, gently softened at its edges. -->
<path d="M151 89 C155 99 158 102 169 106 C158 110 155 113 151 124 C147 113 144 110 133 106 C144 102 147 99 151 89Z"
 fill="#fff"/>
</svg>