<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Orbit Tasks, planeta violeta">
  <defs>
    <radialGradient id="sphere" cx=".32" cy=".18" r=".89">
      <stop offset="0" stop-color="#b29aff"/>
      <stop offset=".26" stop-color="#8258ea"/>
      <stop offset=".66" stop-color="#5d38bf"/>
      <stop offset="1" stop-color="#28135d"/>
    </radialGradient>
    <linearGradient id="saturn-ring" x1=".09" y1=".88" x2=".94" y2=".16">
      <stop stop-color="#392078"/>
      <stop offset=".29" stop-color="#7149d0"/>
      <stop offset=".6" stop-color="#b69cff"/>
      <stop offset="1" stop-color="#7044d3"/>
    </linearGradient>
    <linearGradient id="ring-edge" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#3b1d84"/>
      <stop offset=".55" stop-color="#a187f4"/>
      <stop offset="1" stop-color="#7e55e2"/>
    </linearGradient>
    <radialGradient id="soft-highlight" cx=".18" cy=".18" r=".8">
      <stop stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-.35" y="-.35" width="1.7" height="1.8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <ellipse cx="126" cy="216" rx="80" ry="11" fill="#5432bb" opacity=".18" filter="url(#shadow)"/>
  <!-- Far side of the Saturn ring runs behind the planet. -->
  <ellipse cx="128" cy="128" rx="122" ry="49" transform="rotate(-33 128 128)"
    fill="none" stroke="url(#ring-edge)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="127" cy="127" r="83" fill="url(#sphere)"/>
  <circle cx="127" cy="127" r="81" fill="url(#soft-highlight)" opacity=".38"/>
  <path d="M79 75C60 95 58 143 78 169" stroke="#c3a8ff" stroke-opacity=".17"
    stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M168 68C197 103 194 160 166 184" stroke="#260f65" stroke-opacity=".25"
    stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Foreground arc masks the bottom edge of the sphere. -->
  <path d="M30 158C32 195 97 179 158 141C197 117 222 89 227 75"
    fill="none" stroke="#2c165e" stroke-width="22" stroke-linecap="round"/>
  <path d="M29 154C33 186 98 175 158 138C197 115 219 92 225 77"
    fill="none" stroke="url(#saturn-ring)" stroke-width="15" stroke-linecap="round"/>
  <path d="M53 166C100 159 167 119 205 91" fill="none" stroke="#ddd0ff"
    stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
  <path d="M153 83C157 94 160 97 171 101C160 105 157 108 153 119C149 108 146 105 135 101C146 97 149 94 153 83Z"
    fill="#fff"/>
</svg>